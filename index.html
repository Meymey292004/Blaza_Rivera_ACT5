<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACT5 Services</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101827; color: #f3f4f6; }
    main { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    h1 { margin-bottom: 8px; }
    p { color: #aab6c8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-top: 32px; }
    .service { padding: 20px; border: 1px solid #2d3b51; border-radius: 8px; background: #172235; }
    .service h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .status { color: #7dd3a8; font-weight: 600; }
    form { margin-top: 32px; padding: 20px; border: 1px solid #2d3b51; border-radius: 8px; background: #172235; }
    label { display: block; margin-top: 12px; color: #aab6c8; }
    input, button { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #40516d; border-radius: 4px; background: #101827; color: #f3f4f6; }
    button { margin-top: 18px; cursor: pointer; background: #2563eb; border-color: #2563eb; }
    #order-result { min-height: 1.5em; color: #7dd3a8; }
  </style>
</head>
<body>
  <main>
    <h1>ACT5 Microservices</h1>
    <p>Frontend container is running. Service endpoints are available through Docker Compose.</p>
    <section class="grid" aria-label="Services">
      <article class="service"><h2>Inventory</h2><p>Port 3001</p><span class="status">Ready</span></article>
      <article class="service"><h2>Orders</h2><p>Port 3002</p><span class="status">Ready</span></article>
      <article class="service"><h2>Payments</h2><p>Port 3003</p><span class="status">Ready</span></article>
      <article class="service"><h2>Notifications</h2><p>Port 3004</p><span class="status">Ready</span></article>
    </section>
    <form id="order-form">
      <h2>Place an order</h2>
      <label for="customer-id">Customer ID</label>
      <input id="customer-id" name="customerId" value="frontend-customer" required>
      <label for="sku">SKU</label>
      <input id="sku" name="sku" value="item-1" required>
      <label for="quantity">Quantity</label>
      <input id="quantity" name="quantity" type="number" min="1" value="1" required>
      <button type="submit">Submit order</button>
      <p id="order-result" role="status"></p>
    </form>
    <form id="inventory-form">
      <h2>Add inventory</h2>
      <label for="product-name">Product name</label>
      <input id="product-name" name="name" required>
      <label for="product-quantity">Quantity</label>
      <input id="product-quantity" name="quantity" type="number" min="0" value="1" required>
      <label for="product-price">Price</label>
      <input id="product-price" name="price" type="number" min="0" step="0.01" value="0" required>
      <button type="submit">Add inventory</button>
      <p id="inventory-result" role="status"></p>
    </form>
  </main>
  <script>
    document.getElementById('order-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const result = document.getElementById('order-result');
      const response = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customerId: form.get('customerId'),
          items: [{ sku: form.get('sku'), quantity: Number(form.get('quantity')) }]
        })
      });
      const order = await response.json();
      result.textContent = response.ok ? `Order placed: ${order.id}` : order.error;
    });
  </script>
  <script>
    document.getElementById('inventory-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const result = document.getElementById('inventory-result');
      const response = await fetch('/api/inventory', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: form.get('name'),
          quantity: Number(form.get('quantity')),
          price: Number(form.get('price'))
        })
      });
      const product = await response.json();
      result.textContent = response.ok ? `Inventory added: ${product.name}` : product.error;
    });
  </script>
</body>
</html>
